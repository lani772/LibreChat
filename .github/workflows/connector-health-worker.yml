name: Connector health worker reliability

on:
  push:
    branches:
      - feat/saas-mcp-platform-foundation
    paths:
      - 'api/server/services/ConnectorHealthJobWorker.js'
      - 'api/server/services/ConnectorHealthJobWorker*.spec.js'
      - 'api/server/routes/connectors.js'
      - 'api/server/routes/__tests__/connectors.spec.js'
      - 'client/src/components/SidePanel/MCPBuilder/GoogleWorkspaceConnections.tsx'
      - 'client/src/components/SidePanel/MCPBuilder/GoogleWorkspaceConnections.spec.tsx'
      - 'packages/api/src/connectors/ConnectorHealthRetryPolicy.ts'
      - 'packages/api/src/connectors/ConnectorHealthRetryPolicy.spec.ts'
      - 'packages/api/src/connectors/oauth/GoogleWorkspaceOAuthAdapter.ts'
      - 'packages/api/src/mcp/MCPManager.ts'
      - 'packages/data-schemas/src/schema/connectorRevocation.ts'
      - 'packages/data-schemas/src/schema/connectorInstallation.ts'
      - 'packages/data-schemas/src/schema/connectorCredential.ts'
      - 'packages/data-schemas/src/schema/googleOAuthState.ts'
      - '.github/workflows/connector-health-worker.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'api/server/services/ConnectorHealthJobWorker.js'
      - 'api/server/services/ConnectorHealthJobWorker*.spec.js'
      - 'api/server/routes/connectors.js'
      - 'api/server/routes/__tests__/connectors.spec.js'
      - 'client/src/components/SidePanel/MCPBuilder/GoogleWorkspaceConnections.tsx'
      - 'client/src/components/SidePanel/MCPBuilder/GoogleWorkspaceConnections.spec.tsx'
      - 'packages/api/src/connectors/ConnectorHealthRetryPolicy.ts'
      - 'packages/api/src/connectors/ConnectorHealthRetryPolicy.spec.ts'
      - 'packages/api/src/connectors/oauth/GoogleWorkspaceOAuthAdapter.ts'
      - 'packages/api/src/mcp/MCPManager.ts'
      - 'packages/data-schemas/src/schema/connectorRevocation.ts'
      - 'packages/data-schemas/src/schema/connectorInstallation.ts'
      - 'packages/data-schemas/src/schema/connectorCredential.ts'
      - 'packages/data-schemas/src/schema/googleOAuthState.ts'
      - '.github/workflows/connector-health-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connector-health-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health-worker-tests:
    name: MongoDB worker and route tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Build workspace packages required by backend imports
        run: |
          npm run build:data-provider
          npm run build:data-schemas
          npm run build:api

      - name: Run worker unit, MongoDB concurrency, and connector route tests
        run: >-
          npm run test --workspace api -- --runInBand
          server/services/ConnectorHealthJobWorker.spec.js
          server/services/ConnectorHealthJobWorker.integration.spec.js
          server/routes/__tests__/connectors.spec.js

      - name: Run retry-policy tests
        run: >-
          npm run test:ci --workspace @librechat/api -- --runInBand
          src/connectors/ConnectorHealthRetryPolicy.spec.ts

      - name: Run Google Workspace connection UI tests
        run: >-
          npm run test:ci --workspace client -- --runInBand
          src/components/SidePanel/MCPBuilder/GoogleWorkspaceConnections.spec.tsx
